name: docs-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate guard syntax
        run: node --check scripts/verify-docs-guard.mjs

      - name: Run guard tests
        run: node --test tests/docs-guard/*.test.mjs

      - name: Run documentation guard
        run: node scripts/verify-docs-guard.mjs

      - name: Verify auto-docs remains dry-run clean
        run: node scripts/auto-docs.mjs --dry-run
