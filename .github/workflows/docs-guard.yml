name: docs-guard

on:
  push:
  pull_request:

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run documentation sync guard
        run: node scripts/verify-docs-guard.mjs
